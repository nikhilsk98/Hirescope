# Company name resolution for inputs/companies/my_companies.csv (and any company name).
# Legal entity names, old names and acquired companies -> the brand that recruits today.
# Rows that resolve to the same brand are merged (their notes and careers URLs are kept).
# Only well-established facts belong here; anything uncertain goes under `manual` with a note.

aliases:
  "LastPass US LP": LastPass
  "N-able, Inc.": N-able
  "N-able Technologies, Inc.": N-able                 # same company, two legal entities
  "The MathWorks, Inc.": MathWorks
  "MathWorks": MathWorks
  "Veeam Software Corporation": Veeam
  "CGI Technologies and Solutions Inc.": CGI
  "RSA Security LLC": RSA
  "Zerto, Inc.": Hewlett Packard Enterprise            # acquired by HPE (2021); recruits through HPE
  "Nuance Communications, Inc.": Microsoft             # acquired by Microsoft (2022)
  "Charles River Development, Inc.": State Street      # acquired by State Street (2018)
  "Art Technology Group, Inc.": Oracle                 # ATG, acquired by Oracle (2011)
  "Oracle OTC Subsidiary LLC / ATG": Oracle
  "Dassault Systemes Holdings LLC": Dassault Systèmes
  "Dassault Systemes SolidWorks Corporation": Dassault Systèmes   # SOLIDWORKS recruits with Dassault Systèmes
  "Sapient Corporation / Publicis Sapient": Publicis Sapient
  "Medical Information Technology, Inc. / MEDITECH": MEDITECH
  "Raytheon BBN Technologies Corp.": RTX               # BBN is part of RTX (Raytheon)
  "ITA Software LLC": Google                           # acquired by Google (2011)
  "Black Duck Software, Inc.": Black Duck
  "NTT DATA International Services, Inc.": NTT DATA
  "Thrive Operations, LLC": Thrive (managed IT services)
  "Semrush Holdings, Inc.": Semrush
  "Akamai Technologies, Inc.": Akamai
  "Advanced Micro Devices, Inc.": AMD                   # the name on careers.amd.com job pages
  "Advanced Micro Devices": AMD
  "Tive Inc": Tive
  "Bitsight Technologies, Inc.": Bitsight
  "22nd Century Technologies Inc.": 22nd Century Technologies
  "ZOLL Medical Corporation": ZOLL Medical
  "Pegasystems Inc.": Pegasystems
  "Immersive (formerly Immersive Labs)": Immersive
  "Numerated (check Moody's recruiting)": Numerated
  "Velsera (Seven Bridges)": Velsera
  "Juniper Networks, Inc.": Hewlett Packard Enterprise  # acquired by HPE (2025); juniper.net careers -> careers.hpe.com
  "CyberArk": Palo Alto Networks                       # acquired by Palo Alto Networks; cyberark.com/careers redirects there
  "Kensho": S&P Global                                 # S&P Global subsidiary (2018); posts on S&P Global's Workday board

# Always "Manual check needed" (never probed): names that can't be mapped to a current employer, and employers
# whose jobs live somewhere HireScope can't read. Keys are CSV names or brands; the careers_url in
# inputs/companies/my_companies.csv is the page to check by hand. Platforms checked live 2026-10-12.
manual:
  "Endure Digital Intermediate Holdings, Inc.": "Current employer not confirmed: probably Newfold Digital (Endurance International + Web.com, announced as 'Endure Digital'); the careers_url is Newfold's Workday board — confirm before relying on it."
  "GetGo Investment LLC": "Current employer not confirmed: probably GoTo (GetGo was the Citrix unit merged into LogMeIn, now GoTo); the careers_url is GoTo's Workday board — confirm before relying on it."
  "Excel Switching Corporation": "Historical company (acquired in 1999); no current careers site found."
  # Own careers sites that robots.txt or the site's terms don't let us read (docs/experimental_big_tech.md)
  Google: "Google Careers: robots.txt disallows the job results and job pages."
  Meta: "Meta Careers: automated collection prohibited without written permission."
  Apple: "Apple Jobs: the site's terms forbid automated access."
  IBM: "IBM Careers: own site behind a bot challenge; no public job API."
  Tesla: "Tesla Careers: own site; every request (even robots.txt) is bot-blocked."
  Citadel: "Citadel careers: own site behind a Cloudflare bot check."
  Citadel Securities: "Citadel Securities careers: own site behind a Cloudflare bot check."
  Uber: "Uber Careers: own site; robots.txt disallows its job API."
  Walmart Global Tech: "Walmart Careers: own site (its Workday tenant is retired); robots.txt disallows its job API."
  Shopify: "Shopify careers: own site over a private Ashby board (no public API); robots.txt disallows job search."
  # Own careers sites with no public job API
  MathWorks: "MathWorks careers: own site (blocks automated requests); no public job API."
  Pegasystems: "Pega careers: own site on pega.com; no public job API."
  HubSpot: "HubSpot careers: own site; its Greenhouse board (hubspotjobs) is not public."
  IntelyCare: "IntelyCare careers page lists corporate roles; applications by email."
  TikTok: "TikTok / ByteDance careers: own sites (lifeattiktok.com, joinbytedance.com); no public job API."
  D. E. Shaw: "D. E. Shaw careers: own site; no public job API."
  Valve: "Valve jobs: own site; no public job API."
  # ATS platforms without a supported adapter (2026-10-20: Oracle Recruiting Cloud, SuccessFactors, Avature, BambooHR,
  # JazzHR and Paylocity became supported; their companies left this list)
  Dassault Systèmes: "3ds.com job list with Taleo applications (not supported)."
  CGI: "Njoyn (not supported)."
  eClinicalWorks: "UKG / UltiPro: robots.txt disallows the job board's search endpoint (JobBoardView), so it isn't read."
  Vecna Robotics: "Paycor: robots.txt on recruitingbypaycor.com disallows everything."
  Lusha: "Comeet: positions are synced into lusha.com/careers without schema.org data; Comeet's careers API needs a per-company token that isn't published."
  Earnix: "Comeet: no public job data on earnix.com/our-story/careers; Comeet's careers API needs a per-company token that isn't published."
  22nd Century Technologies: "JobDiva (not supported)."
  Robin: "Kula: robots.txt disallows careers.kula.ai/api/ (the job data); its pages build themselves with JavaScript."
  Ekotrope: "Dover: robots.txt disallows app.dover.com's careers API."
  Brightcove: "Acquired by Bending Spoons; hires on Bending Spoons' Pinpoint board, whose robots.txt disallows postings.json."
  # No public job board found
  Confluent: "Acquired by IBM (2026); its Ashby board (confluent) lists 0 jobs and its careers site is bot-blocked."
  OM1: "No public job board: its careers page still links a deleted Greenhouse board (om1 -> 404); Workable account has 0 jobs."
  ChaosSearch: "No public job board: its careers page links a deleted Greenhouse board (chaossearch -> 404)."
  Auriga: "No careers page found (auriga.com lists LinkedIn only)."

# Legal suffixes stripped when no alias applies ("Toast, Inc." -> "Toast").
legal_suffixes: [inc, incorporated, llc, l.l.c, ltd, limited, corp, corporation, co, company, plc, lp, llp, holdings]
