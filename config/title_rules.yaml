# Title rules (two tracks: Co-op/Intern and Full-time). Applied to normalized titles:
# lowercase, punctuation removed, abbreviations expanded ("Sr. SWE" -> "senior software engineer").
# Levels (entry/mid/senior/staff+) come from config/levels.yaml, not from here.

abbreviations:
  sr: senior
  jr: junior
  swe: software engineer
  sde: software development engineer
  sdet: software development engineer in test
  eng: engineer
  engr: engineer
  ml: machine learning
  mle: machine learning engineer
  ai: artificial intelligence
  dev: developer
  mgr: manager
  fullstack: full stack
  front end: frontend
  back end: backend
  "new grad": new graduate
  ng: new graduate
  coop: co op
  mts: member of technical staff
  "sw engineer": software engineer     # "SW Engineer I - Full Stack" (not a bare "sw": street addresses like "SW 7th St")
  "sw developer": software developer

# Full-time track: a title containing any of these phrases (or a close fuzzy match) is a match,
# with or without a level ("Software Engineer", "Software Engineer II", "Backend Engineer, Payments").
core_titles:
  - software engineer
  - software engineering
  - software developer
  - software development engineer
  - software development engineering
  - backend engineer
  - frontend engineer
  - full stack engineer
  - full stack developer
  - backend developer
  - frontend developer
  - application developer
  - applications developer
  - platform engineer
  - cloud engineer
  - distributed systems engineer
  - web developer
  - data engineer                 # target track (master_resume.md: Data Engineer)
  - cloud developer               # target track: Cloud / AWS Developer
  - aws developer
  - cloud aws developer           # "Cloud/AWS Developer" normalizes to this
  - member of technical staff     # common SWE title at AI labs; "staff" here is not a level
  - engineer software             # "Engineer I - Software", "Engineer, Software" (Northrop, Vermeer)
  - analytics engineer            # data roles (audit 2026-10-20: titled only these ways)
  - data warehouse engineer
  - data platform engineer
  - data engineering

related_titles:
  - product engineer
  - infrastructure engineer
  - site reliability engineer
  - devops engineer
  - machine learning engineer
  - mobile engineer
  - ios engineer
  - android engineer
  - java developer
  - net developer          # ".NET Developer" normalizes to "net developer"
  - python developer
  - javascript developer
  - react developer
  - salesforce developer
  - cloud developer
  - ui developer
  - ui engineer
  - web engineer
  - integration engineer
  - build and release engineer
  - artificial intelligence engineer           # "AI Engineer 1 - Graduate", "Applied AI Engineer (New Grad)"
  - applied artificial intelligence engineer
  - forward deployed engineer                  # "Forward Deployed Engineer (New Grad)" (software, customer-facing)
  - forward deployed software engineer
  - android developer
  - ios developer
  - mobile developer
  - programmer analyst

# Co-op/Intern track: an intern/co-op title matches when it also contains one of these words
# ("Software Engineering Co-op", "SDE Intern", "Spring 2027 Co-op - Backend").
coop_role_words: [software, developer, software development, sde, swe, backend, frontend,
  full stack, web, cloud, platform, programming, programmer, computer science,
  infrastructure, devops, data engineering, machine learning, application development, applications development,
  mobile, ios, android, compiler, artificial intelligence engineer, artificial intelligence engineering]

# rapidfuzz token_sort_ratio threshold (0-100) for fuzzy title matches
fuzzy_threshold: 90

# Words that indicate employment type when present in the title.
employment_type_words:
  internship: [intern, internship]
  co-op: [co op]
  new_grad: [new graduate, university graduate, early career, entry level, campus]

# --- New Grad / early-career titles (regexes, case-insensitive). Matching full-time roles get the New Grad boost
# (preferences boosts.new_grad) and the "New Grad" badge; also used by the hiring-season tracker.
new_grad_patterns:
  - 'new grad(uate)?s?'
  - 'university grad(uate)?'
  - 'college grad(uate)?'
  - 'early career'
  - 'entry[- ]level'
  - 'class of 20\d\d'
  - 'graduate (software|engineer|developer|program|programme)'
  - 'rotational'
  - 'recent grad(uate)?s?'

# Phrases that contain level-like words but are not levels ("staff" in "member of technical staff").
non_level_phrases: [member of technical staff]

# --- Meaning-based pre-filter (preferences prefilter: threshold / margin) --------------------------------
# What you are looking for: a hidden job whose title + opening is close to one of these (and closer than to any
# contrast profile) is rescued. Your resume's summary lines are added at runtime.
role_profile:
  - Software engineer building backend services, APIs and distributed systems
  - Full-stack web developer building React and Node.js applications
  - Frontend engineer building web user interfaces in JavaScript and TypeScript
  - Software engineering intern or co-op student writing production code
  - Cloud and platform engineer building infrastructure, CI/CD and developer tooling
  - Software developer writing, testing and deploying application code
  - New graduate software engineer joining an engineering team
# Technical roles that are NOT this search.
contrast_profiles:
  - Electrical or hardware engineer designing circuits, boards and power electronics
  - Mechanical, manufacturing, process or industrial engineer working on physical products
  - Digital IC, ASIC, FPGA or chip design and verification engineer
  - Civil, structural, project or construction engineer
  - Sales engineer, solutions consultant or customer-facing technical support
  - Lab technician, test technician or field service technician
  - Research scientist publishing papers in a research lab
# A rescue needs one of these (regex fragments, whole words) in the title: generic "Engineering Intern" / "Systems
# Engineer" / "Design Engineer" titles are too often mechanical, electrical or process roles.
tech_hint_words: [software, 'develop(er|ers|ment engineer\w*)', 'programm\w*', cloud, devops, devsecops, platform,
  'full[- ]?stack', backend, 'back[- ]end', frontend, 'front[- ]end', web, 'data engineer\w*', mts, technical staff,
  technology, 'application(s)?', java, python, '\.?net', salesforce, sde, swe, sre, site reliability,
  infrastructure, automation, integration, ios, android, mobile, coding, computer science, it, artificial intelligence]

# --- Free-text job posts (Hacker News Who's Hiring): a header segment naming one of these is a role --------
posting_role_words: [software, 'engineer(ing)?', developer, swe, sde, programmer, 'full[- ]?stack', 'front[- ]?end',
  'back[- ]?end', devops, sre, platform, infrastructure, mobile, ios, android, data engineer, ml engineer,
  machine learning engineer, 'intern(ship)?', 'co-?op', new grad, founding engineer]

# --- Role keywords searched on query-based sources ---------------------------------------------------------
search_queries:
  # Workday: "co-op" tokenizes to "co" OR "op" and "intern" also hits "International", so co-op/intern roles come
  # from each site's early-career facets instead. Multi-word searches are AND-ed, so phrases stay precise;
  # "developer" alone matches "business development", so only developer phrases are searched.
  workday: [software, software developer, web developer, application developer, internship, new grad,
            cloud engineer, platform engineer, devops, data engineer, full stack, backend, frontend,
            site reliability, infrastructure engineer]
  # SmartRecruiters `q` full-text search ("co-op" / "new grad" match far too broadly, so they are not searched)
  smartrecruiters: [software, developer, intern, engineer]
  # Eightfold PCSX `query` (only for sites with more than ~300 US jobs; smaller sites are listed in full).
  # Results come 10 per request and Microsoft rate-limits bursts, so the list stays short and specific;
  # "new grad" is left out: it is matched loosely (1,163 Microsoft US hits on 2026-10-12, mostly senior roles).
  eightfold: [software engineer, software developer, intern, data engineer, site reliability, full stack]
  # Oracle Recruiting Cloud `keyword` (relevance-ranked inside the site's United States facet; a search stops after a
  # few pages with no relevant title)
  oracle_cloud: [software, developer, intern, data engineer, cloud, new grad, analyst developer]
  # Amazon search.json: each item is one query (category[] or base_query)
  amazon:
    - {"category[]": software-development}
    - {base_query: intern}
    - {base_query: co-op}
    - {base_query: new grad}
