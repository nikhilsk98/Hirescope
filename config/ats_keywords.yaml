# Umbrella terms satisfied by a concrete skill on the resume (shown as a synonym match with the resume's own
# wording, e.g. "Your resume says Git -> JD says version control"). Only real equivalents belong here.
implies:
  Version Control: [Git]
  Relational Databases: [MySQL, PostgreSQL, Oracle, SQL Server, SQLite, Azure SQL]
  NoSQL: [MongoDB, DynamoDB, Cassandra, Redis, Firebase]
  CI/CD: [Jenkins, GitHub Actions, GitLab CI]
  Containerization: [Docker]
  REST: [REST APIs, RESTful]

# Generic words never treated as keywords (they appear in nearly every JD).
stoplist: [team, teams, teammates, passion, passionate, fast-paced, fast paced, dynamic, motivated, self-starter,
  ownership, impact, impactful, collaborate, collaboration, collaborative, communication, communicate, excellent,
  strong, ability, abilities, skills, skill, experience, experienced, knowledge, understanding, familiarity, proficiency,
  proficient, solid, deep, great, good, best, world-class, mission, culture, values, opportunity, growth, learn,
  learning, curious, curiosity, detail-oriented, problem solving, problem-solving, mindset, environment, stakeholders,
  customers, users, product, products, company, business, work, working, years, year, plus, bonus, preferred,
  required, requirements, qualifications, responsibilities, role, position, candidate, candidates, ideal, including,
  etc, e.g, i.e, US, USA, EEO, PTO, 401k, benefits]
