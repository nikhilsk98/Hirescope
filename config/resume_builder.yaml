# Resume Builder settings (see README → Resume Builder). Changing this file changes the settings hash, so the
# next /resume-builder run for a job builds a new version instead of reusing the last one (desktop_copy excepted).

# Employer-facing PDF: <first>_<last>_Resume_<Company>.pdf (job IDs only in folder names and manifests).
# Empty = taken from the "# First Last" heading of inputs/resume/master_resume.md (kept out of this public repo).
naming:
  first_name: ""
  last_name: ""

page_count: 1

# Resume copies (src/resume_builder/desktop.py): each READY version's employer-facing PDF is copied to
# <dir>/<Company>/<Role>_<JobID>/ (current as <First>_<Last>_Resume_<Company>.pdf, older READY versions as _v<N>.pdf;
# the default resume in <dir>/Default/). Re-sync anytime: ./scripts/sync_desktop_resumes.sh. Not part of the
# settings hash: changing it never forces a rebuild.
desktop_copy:
  enabled: true
  dir: ~/HireScope Resumes      # not a macOS-protected folder: background builds write here without asking
                                # (~/Desktop/Generated Resumes is a Finder alias to it)

# Section order (rules 24–25, v4.1): the same for every application and every level, never reordered. The audience
# (student vs experienced, from HireScope's track and level) decides only whether a 3rd project is allowed (rule 47).
section_order:
  student: [education, skills, experience, projects]
  experienced: [education, skills, experience, projects]
audience:
  experienced_levels: [mid, senior, staff_plus, manager]
  experienced_min_yoe: 3       # a full-time role with no level in its title counts as mid-level when it asks this many years

# Experience bullets (rules 22–23). These are defaults; the numbers in inputs/resume/resume_rules.md win, and rule 24's
# per-employer starting allocations are read from there too (employer names stay out of this public file).
experience_bullets:
  total: {min: 8, max: 11}
  primary: {start: 4, max: 5}      # most relevant role
  second: {start: 3, max: 4}
  internship: {start: 2, max: 3}   # a relevant internship
  other: {start: 1, max: 1}        # older or less relevant roles: 0–1

# Projects (rules 46–47, v4.6): exactly 2 on every resume, for every track and level (a 3rd only for co-op roles,
# when it fills a JD gap). Fewer than limits.projects.min fails validation. Bullets per project:
# limits.bullets_per_project.
projects_by_audience:
  student: {count: 2, max: 3}
  experienced: {count: 2, max: 2}

summary:
  enabled: false          # rules: no summary by default; the drafter may add one only for a clear specialization
  allow_when_strong_fit: true
  max_words: 45

limits:
  projects: {min: 2, max: 3}                # rule 46: never fewer than 2; overflow trimming never removes a project
  bullets_per_project: {min: 2, max: 2, overflow_min: 1}   # 2 bullets each; rule 67's last step may go down to 1
  bullets_per_role: {min: 1, max: 4}
  bullet_max_words: 34          # a review hint; the real limit is 2 rendered lines (rule 43)
  bullet_max_lines: 2
  keyword_max_repeats: 3       # a JD keyword more than this many times across the resume is flagged
  courses: {min: 0, max: 3}                  # rule 46: 0–3 relevant courses
  skills_per_category: 8

# Layout limits the repair loop may never cross. The template is 10pt with 1.4cm margins.
layout:
  min_font_pt: 10.0            # rule 53: never below 10 pt (bullet symbols are excluded)
  min_margin_cm: 1.25          # text may not come closer to any page edge (rule 17: 0.5 in = 1.27 cm)
  max_bottom_whitespace: 0.30  # warn when more than this share of the page height is empty at the bottom
  entry_gap_pt: 6              # space between experience/project entries (as in the template)
  education_gap_pt: 4
  min_entry_gap_pt: 2          # the last repair step may shrink entry gaps down to this, never below

fonts:
  preferred: Calibri           # what the template asks for
  fallback: Carlito            # metric-compatible with Calibri (same line breaks), used when Calibri is not installed

compile:
  timeout_s: 120
  render_dpi: 110              # page images for visual checks and the dashboard preview

repair:
  max_attempts: 3

# Role profiles: auto-picked from the JD (title counts 3x, required keywords 2x, other mentions 1x); override with
# --profile. `lead_with` boosts evidence mentioning these terms when ordering bullets and skills.
profiles:
  backend:
    signals: [backend, back-end, back end, api, apis, rest, restful, microservices, java, spring, spring boot,
              server, sql, database, databases, services, python, node.js, distributed]
    lead_with: [Java, Spring Boot, REST APIs, MySQL, Oracle, Node.js, Express.js, Docker, AWS, Jenkins]
  fullstack:
    signals: [full stack, full-stack, fullstack, frontend, front-end, front end, react, javascript, typescript,
              node.js, web, ui, html, css, redux, mern]
    lead_with: [React, Node.js, Express.js, MongoDB, JavaScript, Redux, Socket.io, REST APIs, Tailwind CSS]
  cloud:
    signals: [cloud, aws, azure, gcp, kubernetes, docker, devops, ci/cd, infrastructure, distributed systems,
              platform, reliability, sre, terraform, linux, networking, release]
    lead_with: [Docker, AWS, Azure, Jenkins, CI/CD, Linux, Azure SQL, Java]
  data:
    signals: [data engineer, data engineering, data pipeline, data pipelines, etl, elt, airflow, spark, kafka,
              data warehouse, warehouse, bigquery, snowflake, redshift, dbt, sql, python, ingestion, lambda]
    lead_with: [Python, SQL, PostgreSQL, AWS Lambda, Amazon S3, Kafka, Docker]
  ml:
    signals: [machine learning, ml, mlops, deep learning, pytorch, tensorflow, scikit-learn, nlp, data science,
              data pipelines, model, models, llm, ai, data engineer, data engineering, etl, spark]
    lead_with: [Python, scikit-learn, NLTK, SQL, MongoDB, MySQL, AWS]
default_profile: fullstack

# Statuses shown on the dashboard; "ready" only after every required check passes, "reviewed" only when you mark it
statuses: [queued, generating, validating, ready, reviewed, failed]

batch:
  max_jobs: 15                 # a batch larger than this is refused (usage limits); split it

# Category & tool mapping (rule 63), specific → general only: a confirmed tool on the right supports the general term on
# the left automatically ("CI/CD pipelines with Jenkins"). The other direction is never automatic: a general term never
# implies a specific tool; the builder asks once which tools you used (and saves the answer to tool_checklist.md).
category_terms:
  CI/CD: [Jenkins, GitHub Actions, GitLab CI, CircleCI, AWS CodePipeline, Azure DevOps, Travis CI, Argo CD]
  continuous integration: [Jenkins, GitHub Actions, GitLab CI, CircleCI, Travis CI]
  build pipelines: [Jenkins, GitHub Actions, GitLab CI, CircleCI, AWS CodePipeline, Azure DevOps]
  containerization: [Docker, Docker Compose, Kubernetes]
  container orchestration: [Kubernetes, Helm, Amazon EKS, Amazon ECS]
  message queues: [Solace, Kafka, RabbitMQ, Amazon SQS, ActiveMQ]
  event-driven messaging: [Solace, Kafka, RabbitMQ, Amazon SQS, Amazon SNS]
  Relational Databases: [MySQL, PostgreSQL, Oracle, SQL Server, Azure SQL, SQLite, MariaDB]
  SQL: [MySQL, PostgreSQL, Oracle, SQL Server, Azure SQL, SQLite]
  NoSQL: [MongoDB, Amazon DynamoDB, Cassandra, Redis, Firebase]
  infrastructure as code: [Terraform, CloudFormation, Pulumi, Ansible]
  cloud computing: [AWS, Azure, Google Cloud]
  Java backend services: [Spring Boot, Spring MVC, Java]
  Unit Testing: [JUnit, PyTest, Jest, Mockito]
  monitoring: [CloudWatch, Prometheus, Grafana, Datadog, Splunk]

# "Transferable" evidence: a JD term you don't have, but a term in the same group you do (shown as related experience,
# never as the same thing: AWS is not GCP). Names are matched through the HireScope keyword vocabulary.
related_groups:
  cloud_platforms: [AWS, Azure, GCP]
  containers: [Docker, Kubernetes, OpenShift]
  relational_databases: [MySQL, PostgreSQL, Oracle, SQL Server, Azure SQL, SQLite, MariaDB]
  nosql_databases: [MongoDB, DynamoDB, Cassandra, Redis, Firebase, Couchbase]
  frontend_frameworks: [React, Angular, Vue.js, Svelte, Next.js]
  backend_frameworks: [Spring, Express.js, Django, Flask, FastAPI, .NET, Ruby on Rails, Node.js]
  ci_cd: [Jenkins, GitHub Actions, GitLab CI, CircleCI, CI/CD]
  messaging: [Kafka, RabbitMQ, Amazon SQS, Solace, ActiveMQ]
  ml_libraries: [scikit-learn, PyTorch, TensorFlow, Keras, NLTK]
  jvm_languages: [Java, Kotlin, Scala]
  scripting_languages: [Python, Ruby, Perl]
  typed_web_languages: [JavaScript, TypeScript]
# --- not part of any resume's input hash: everything below this line only says how builds are run --------------------
# Background resume queue (src/resume_builder/queue.py; the dashboard's Generate Resume / Bucket / Resume Builder tab
# queue builds through the hirescope:// launcher, a launchd worker runs them; see README → Zero-CLI resumes).
resume_queue:
  concurrency: 1            # builds at once (max 2); never the same job twice at once
  retries: 1                # a failed build is retried this many times, then marked Failed with the reason
  timeout_minutes: 30       # a build "Generating" longer than this is stopped (or, with nothing running it, found by the
                            # watchdog), marked Failed with the reason and retried once
  batch_warn: 5             # "Generate resumes for all" asks first (count + usage warning) above this many jobs
  claude: ~/.local/bin/claude
  idle_exit_seconds: 30     # the worker exits this long after the queue empties (launchd starts it again on demand)
