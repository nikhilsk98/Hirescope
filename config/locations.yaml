# Location aliases and country detection. Matching is case-insensitive.
# Edit freely; no code changes needed.

# Variant -> canonical display name (applied to each location part).
aliases:
  nyc: New York, NY
  new york city: New York, NY
  new york city, ny: New York, NY
  manhattan: New York, NY
  sf: San Francisco, CA
  san francisco bay area: SF Bay Area, CA
  sf bay area: SF Bay Area, CA
  bay area: SF Bay Area, CA
  silicon valley: SF Bay Area, CA
  la: Los Angeles, CA
  dc: Washington, DC
  washington d.c.: Washington, DC
  washington, d.c.: Washington, DC
  dmv: Washington, DC
  boston metro: Boston, MA
  greater boston: Boston, MA
  seattle metro: Seattle, WA
  greater seattle area: Seattle, WA
  research triangle: Raleigh, NC

# Phrases that mean "remote, open to the United States".
remote_us:
  - remote - us
  - remote – us
  - remote-us
  - remote us
  - us remote
  - us-remote
  - remote (us)
  - remote (usa)
  - remote, us
  - remote, usa
  - remote, united states
  - remote - united states
  - remote in the us
  - remote within the us
  - remote within the united states
  - united states (remote)
  - united states - remote
  - us (remote)
  - usa (remote)
  - anywhere in us
  - anywhere in the us
  - anywhere in the united states
  - north america (remote)

# Strings that alone mean the United States.
us_names: [united states, united states of america, usa, u.s.a., u.s., us, america]

