# Copy to inputs/preferences.yaml (gitignored) and fill in YOUR values.
# Defaults below are the two-track profile: Spring 2027 co-op/intern + full-time from May 2027, USA,
# entry through mid level (0-5 years). Titles and level words live in config/title_rules.yaml and
# config/levels.yaml; anything here is added on top.

# --- Roles -------------------------------------------------------------
target_titles: []         # extra core titles (title_rules.yaml core_titles already covers SWE/SDE/etc.)
related_titles: []        # extra related titles
excluded_title_words:     # any of these in the title -> filtered ("senior" is handled as Stretch below)
  - staff
  - principal
  - distinguished
  - director
  - manager
  - engineering manager
  - architect
  - head of

# --- Level & experience --------------------------------------------------
levels:
  include: [intern, entry, mid, unknown]   # "unknown" = no level in the title (plain "Software Engineer")
  stretch: [senior]                        # kept with label capped at Stretch, if it asks <= yoe.match_max
  exclude: [staff_plus, manager]
yoe:                      # leave any of these out to derive it from years_experience (+1 / +2 / +3), else 5 / 6 / 7
  match_max: 5            # roles asking 0-5 years are a full match
  stretch_max: 6          # 5-6 years -> Stretch
  filter_min: 7           # 7+ years -> Filtered Out (with the reason)
years_experience: null    # your own years of professional experience: sets the YOE window above when it's left out,
                          # and inside the match window roles asking more than this fit slightly less (yoe_fit.near)
graduation_date: 2027-05  # YYYY-MM

# --- Tracks (both searched every run) --------------------------------------
tracks:
  coop_intern:
    enabled: true
    start_window: ["2026-12", "2027-03"]   # Spring co-op / off-cycle start window
    boost_terms: ["Spring 2027", "Winter 2027", "January 2027", "Jan 2027"]
    filter_summer_only: true               # summer-only internships hidden (full-time starts May 2027)
  full_time:
    enabled: true
    start_from: "2027-05"
    boost_terms: ["Class of 2027", "2027 start", "New Grad 2027", "2027 New Grad"]

# --- Location ----------------------------------------------------------
country: US               # all US states + Remote (US); non-US postings are filtered
preferred_locations: []   # optional soft boost; metros from config/locations.yaml, e.g. [Boston, SF Bay Area]
work_modes: [remote, hybrid, onsite]

# --- Domain / pay / authorization -------------------------------------
domains: []              # e.g. [fintech|payments|banking, health care, robotics]: a job whose title, company or JD
                          # mentions one gets a preference boost ("|" lists alternatives); silence never counts against
salary:
  min: null
  currency: USD
  mode: soft              # hard = filter out below min (only when salary is stated); soft = score only
work_authorization:       # never assumed: fill these in yourself
  needs_sponsorship: null # true -> full-time "no sponsorship" filtered, co-op flagged (CPT/OPT); null = unknown
  us_citizen: null        # false -> "US citizens / US persons only" and "clearance required" filtered
  us_person: null         # false -> export-control "U.S. person" requirements filtered (both tracks); null follows us_citizen
  coop_no_sponsorship: flag  # co-op/intern says "no sponsorship": flag = keep with "check CPT/OPT", filter = hide

# --- Companies (tiers) --------------------------------------------------
# Tiers override config/companies.yaml. tier1: every run; tier2: daily; tier3: every 3 days.
# Companies in inputs/companies/my_companies.csv are checked every run regardless.
company_tiers:
  tier1: []
  tier2: []
  tier3: []
  excluded: []
  check_every_hours: {1: 0, 2: 20, 3: 70}   # how often each tier is checked (0 = every run)
  max_pages: {1: 100, 2: 25, 3: 10}         # listing pages per company per run, by tier
  feed_tier: 2                              # companies known only from the SimplifyJobs internship / new-grad
                                            # lists score as this tier (else they'd be tier 3)

# --- Freshness ---------------------------------------------------------
max_posting_age_days: 60

# --- Hard exclusions vs soft preferences -------------------------------
rules:
  title: hard
  seniority: hard
  location: hard
  yoe: hard               # applies to yoe.filter_min+
  employment_type: soft   # contract / part-time / temporary
  posting_age: soft
  summer_only: hard       # co-op track: summer-only internships (see tracks.coop_intern.filter_summer_only)
  grad_window: hard       # a stated graduation window ("Class of 2026") that excludes your graduation date
  start_window: soft      # a stated start date outside the track's window
  stale_posting: hard     # posted more than ghost.stale_days ago (likely a stale or evergreen listing)
  work_authorization: hard  # explicit no-sponsorship (full-time) / citizens-only / clearance-required postings

# --- Scoring -----------------------------------------------------------
weights:
  qualification: 0.65
  preference: 0.35
  qualification_parts: {skills: 0.4, semantic: 0.4, level: 0.2}
  preference_parts: {location: 0.35, company_tier: 0.35, employment_type: 0.15, salary: 0.15, domain: 0.15}

# --- Freshness (an additive, capped bonus; never lifts a job past a hard filter) ----------------
freshness: {boost_24h: 8, boost_72h: 4, decay_days: 21, cap: 10, coop_multiplier: 1.5}
# --- Priority boosts (total capped) -------------------------------------------------------------
boosts: {new_grad: 8, term: 4, grad_match: 3, cap: 12}
# --- Ghost-job signals --------------------------------------------------------------------------
ghost: {age_days: 90, stale_days: 365, age_penalty: 5, repost_penalty: 4, evergreen_penalty: 4}
# --- Meaning-based pre-filter (local embeddings rescue relevant jobs with unusual titles) -------
prefilter: {enabled: true, threshold: 0.52, margin: 0.05}
# --- Optional: H-1B sponsorship history (USCIS Employer Data Hub CSV you download yourself) -----
# Company history only, never job-level eligibility. Off by default.
sponsorship_history: {enabled: false, file: inputs/h1b/h1b_employer_data.csv}
thresholds:
  strong: 70
  stretch: 50
top_n: 1000               # max non-filtered jobs per track written to the dashboard
timezone: America/New_York
my_companies_csv: inputs/companies/my_companies.csv
statuses_import_dir: [~/Downloads, inputs/statuses]   # newest export wins; inputs/statuses always works for scheduled runs
# --- Feedback learning (from your dashboard statuses; bounded, listed under "Learned adjustments") --------
feedback: {enabled: true, min_evidence: 2, max_per_feature: 3, max_total: 6, weight_nudge_max: 0.25, weight_min_jobs: 5,
           positive_weights: {shortlisted: 1, package exported: 1, applied: 1, interviewing: 1, offer: 1, interested: 0.5},
           reason_groups: {company: [company], location: [location], too senior: [level], too junior: [level], missing skills: [missing_skills], not interested in role: [skills, domain]}}
# --- My Applications ---------------------------------------------------------------------------
applications: {follow_up_days: [7, 10], ghosted_after_days: 30, same_company_window_days: 30, near_duplicate_ratio: 85}
# LinkedIn connections export (Settings > Data privacy > Get a copy of your data > Connections). Optional.
connections_csv: inputs/linkedin/Connections.csv
# --- Optional aggregator (off by default; key in .env). Sends only these queries to the provider. -----------
aggregator:
  enabled: false
  provider: jsearch       # jsearch | serpapi
  queries: ["software engineer new grad 2027", "software engineer intern spring 2027", "software engineering co-op 2027", "entry level software engineer"]
  date_posted: week
# --- Notifications / digest / seasons -----------------------------------------------------------------
# Manual Checks view + weekly digest: flag a manual company not checked in this many days
manual_checks: {remind_days: 7}
notifications: {enabled: true, early_bird_hours: 48, digest_weekday: Sunday, season_remind_days: 21}   # early_bird_hours is also the "Fresh" badge window

# ======================================================================================================
# Fine-tuning. Every value below is the built-in default; change any of them here (nothing is hardcoded).
# ======================================================================================================

# --- Rules: details -----------------------------------------------------------------------------------
grad_window_slack_months: 2      # a stated graduation window ("graduating Dec 2026 - Jun 2027") still matches
                                 # if your graduation_date is within this many months of it
excluded_employment_types: [contract, part_time, temporary]   # rules.employment_type applies to these;
                                 # they also score 0 on the employment-type component

# --- Scoring: component scores (0-100) and penalty points ------------------------------------------------
scoring:
  soft_rule_penalty: 5           # points off per failed soft rule (rules: ... soft)
  neutral_qualification: 50      # qualification score when a listing has no JD text (uncertain, not a match)
  yoe_penalty_per_year: 8        # points off per required year above yoe.match_max ...
  yoe_penalty_cap: 30            # ... capped here
  citizenship_penalty: 30        # citizens-only posting, only when work_authorization.us_citizen is not set
  clearance_penalty: 10          # clearance-required posting, only when work_authorization.us_citizen is not set
  title_fit: {core: 100, coop: 100, related: 85, semantic: 70}       # core/co-op title vs related vs meaning match
  level_fit: {intern: 100, entry: 100, mid: 100, senior: 60, other: 30}
  yoe_fit: {match: 100, near: 90, stretch: 60, over: 20}   # required years <= years_experience / <= match_max /
                                 # <= stretch_max / above
  domain_fit: {match: 100}       # the domain component when one of your domains is mentioned
  preferred_skill_weight: 0.5    # a preferred-only skill counts half of a required one
  semantic_scale: [0.15, 0.60]   # resume-vs-JD cosine similarity mapped to 0..100 (at or below the first = 0)
  similar_min: 0.3               # "More like this": nearest open roles at least this similar
  grad_fit: {match: 100, mismatch: 25}           # JD's graduation year(s) include yours / don't
  degree_above_yours: 40         # JD asks for a higher degree than your resume shows
  location_fit: {preferred: 100, remote_us: 90, other_us: 75, no_preferences: 100}   # no_preferences: when
                                 # preferred_locations is empty, every US location scores this
  tier_fit: {1: 100, 2: 75, 3: 50}   # company tier (a company outside your tiers and the seed list counts as 3)

# --- Apply Today queue + Closing soon ------------------------------------------------------------------
apply_today:
  size: 5                        # jobs shown per track (twice that with "Show both tracks")
  fresh_24h: 10                  # urgency points: posted in the last 24h ...
  fresh_72h: 5                   # ... or the last 72h
  closing_soon: 6                # deadline within closing_soon_days
  strong: 5                      # Strong label
  closing_soon_days: 7           # also the "Closing soon" badge and view

# --- Source health alerts ----------------------------------------------------------------------------
health:
  drop: 0.70                     # alert when a source lists 70% fewer jobs than its recent average
  min_history: 2                 # successful past runs needed before judging
  min_avg_zero: 3                # "returned 0 jobs" only for sources that usually list at least this many
  min_avg_drop: 10               # drop alerts only for sources this big (small boards swing naturally)

# --- Schedule (scripts/schedule.sh install reads these) and backups --------------------------------------
schedule:
  full_times: ["08:00", "18:00"]   # launchd full runs, local time
  quick_hours: 2.5                 # quick checks (My Companies + tier 1) every N hours; 0 = off
backups:
  dir: null                        # default data.nosync/backups; e.g. "~/Library/Mobile Documents/com~apple~CloudDocs/HireScope"
  keep: 14                         # daily backups kept
